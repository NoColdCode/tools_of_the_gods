modLoader="javafml"
loaderVersion="${loader_version_range}"
license="Not specified"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://mcreator.net"
authors="Swyde, MCreator"
description='''
Progressive tools and weapons for Minecraft ${minecraft_version} (Forge).
Shared assets live in :common; Java backport in version-specific common-* modules.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"
