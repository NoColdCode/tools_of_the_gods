modLoader="javafml"
loaderVersion="${loader_version_range}"
license="Not specified"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://mcreator.net"
authors="Swyde, MCreator"
credits="Wing textures by OhDeerDreamy (Planet Minecraft)"
description='''
Progressive tools and weapons for Minecraft ${minecraft_version} (NeoForge).
Shared assets live in :common; Java backport in version-specific common-* modules.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"
